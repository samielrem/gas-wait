name: Refresh weekly gas signal

on:
  schedule:
    # Daily at 18:00 UTC (2:00 p.m. Eastern). EIA's weekly retail print
    # is usually available after Tuesday noon ET; earlier days no-op if
    # the CLI cannot build a fresh row.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gas_wait
    steps:
      - name: Check out Gas Wait
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gas_wait/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Fetch latest EIA datasets
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: PYTHONPATH=src python -m data.build_dataset --fetch

      - name: Generate weekly signal JSON
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: PYTHONPATH=src python -m gas_wait_cli --json > data/processed/latest-signal.json

      - name: Validate signal JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/processed/latest-signal.json")
          payload = json.loads(path.read_text())
          required = {
              "signal",
              "predicted_change_dollars_per_gallon",
              "predicted_change_cents_per_gallon",
              "horizon",
              "latest_data_date",
              "model",
              "prediction_date",
              "national_weekly_disclaimer",
          }
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"Signal JSON missing keys: {sorted(missing)}")
          if payload["signal"] not in {"WAIT", "FILL UP", "NO CLEAR SIGNAL"}:
              raise SystemExit(f"Unexpected signal: {payload['signal']}")
          print(payload["signal"], payload["prediction_date"])
          PY

      - name: Commit and publish signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/latest-signal.json
          if git diff --cached --quiet; then
            echo "Signal unchanged."
            exit 0
          fi
          git commit -m "Refresh weekly national gas signal"
          git push
